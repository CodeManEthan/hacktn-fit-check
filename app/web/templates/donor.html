{% extends "base.html" %}
{% block title %}Add a device &middot; Fit-Check{% endblock %}
{% block content %}
<section class="panel">
  <h1>What are you donating?</h1>
  <p class="lede">The nameplate on the back carries the manufacturer, model,
     voltage and frequency. Photograph it and the rest follows.</p>

  <form method="post" action="/donor" enctype="multipart/form-data" class="stack">
    <label class="field">
      <span class="label">Nameplate photo</span>
      <input type="file" name="nameplate" accept="image/*">
      <span class="hint">Optional, but it is the most reliable input.</span>
    </label>

    <label class="field">
      <span class="label">Make and model</span>
      <input type="text" name="model_name"
             placeholder="Puritan Bennett 840 ventilator, 2009">
    </label>

    <label class="field">
      <span class="label">Anything else you know</span>
      <textarea name="spec_text" rows="6"
        placeholder="Paste the spec sheet, the label text, or what the biomed department told you."></textarea>
      <span class="hint">Pasted text beats model knowledge. Anything left blank
        stays unknown rather than being guessed.</span>
    </label>

    <button class="primary" type="submit">Read the specs &rarr;</button>
  </form>
</section>
{% endblock %}
