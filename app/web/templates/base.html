<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fit-Check{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="topbar-left">
        <a class="mark" href="/">Fit-Check</a>
        <span class="env">standards: IEC 60601-1 / WHO Annex 1</span>
      </div>
      <div class="topbar-right">
        <span class="status"><i class="dot"></i>{{ rule_count }} deterministic rules active</span>
        <a class="link" href="/review">Recipients</a>
        <a class="link" href="/impact">Audit log</a>
      </div>
    </div>
  </header>
  <main class="deck">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
