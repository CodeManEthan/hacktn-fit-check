<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fit-Check{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="mark" href="/">Fit-Check</a>
      <span class="status"><i class="dot"></i>{{ rule_count }} deterministic rules active</span>
    </div>
  </header>
  <main class="deck">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <div class="footer-in">
      <span>Grounded in IEC 60601-1 and WHO Annex 1 standards</span>
      <span class="footer-links">
        <a href="/review">Recipients</a>
        <a href="/impact">Audit log</a>
        <span class="footer-mark">HackTN 2026</span>
      </span>
    </div>
  </footer>
</body>
</html>
