{% extends "base.html" %}
{% block title %}Post a request{% endblock %}
{% block content %}
<section class="plate">
  <h1>What do you need?</h1>
  <p class="sub">We will screen every open offer of that type against your profile
     and show you only the ones that can actually work, nearest first.</p>

  <form method="post" action="/request" class="form">
    <div class="field">
      <label class="name" for="f-facility-slug">Facility</label>
      <select id="f-facility-slug" name="facility_slug">
        {% for f in facilities %}
        <option value="{{ f.slug }}">{{ f.name }} &mdash; {{ f.country }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="row">
      <div class="field">
        <label class="name" for="f-device-type">Equipment needed</label>
        <input type="text" id="f-device-type" name="device_type" placeholder="ventilator">
      </div>
      <div class="field">
        <label class="name" for="f-quantity">How many</label>
        <input type="text" id="f-quantity" name="quantity" value="1">
      </div>
    </div>

    <div class="field">
      <label class="name" for="f-note">Anything the donor should know</label>
      <textarea id="f-note" name="note" rows="3" placeholder="For the neonatal unit. We have one working unit and no spare."></textarea>
    </div>

    <button class="go" type="submit">Find what fits</button>
  </form>
</section>
{% endblock %}
